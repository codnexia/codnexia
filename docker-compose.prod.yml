services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - client
    restart: unless-stopped

  server:
    build: ./server
    env_file: ./server/.env
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: /api
    depends_on:
      - server
    restart: unless-stopped

volumes:
  uploads:
  caddy_data:
  caddy_config:
